# Builds the release EXE on GitHub-hosted runners, signs it through SignPath and attaches it to the release.
#
# Trigger: pushing a tag "v*" (for example v1.4), or manually via "Run workflow".
# Signing runs only when the repository variable SIGNPATH_ORGANIZATION_ID is set (see docs/RELEASING.md).
# Without it, the workflow still builds and attaches an unsigned EXE.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the draft release and upload assets
  actions: read     # SignPath reads job details and downloads the unsigned artifact

jobs:
  release:
    runs-on: windows-latest
    env:
      EXE_NAME: K26KControllerMerger.exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/ControllerMerger.Tests -c Release

      - name: Publish single-file EXE
        run: dotnet publish src/ControllerMerger -c Release -o artifacts/publish

      - name: Upload unsigned EXE
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: artifacts/publish/${{ env.EXE_NAME }}
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # release signing needs a manual approval in SignPath
          output-artifact-directory: artifacts/signed

      - name: Prepare release files
        id: files
        shell: pwsh
        run: |
          $signed = Join-Path 'artifacts/signed' $env:EXE_NAME
          $out = New-Item -ItemType Directory -Force 'artifacts/release'
          if (Test-Path $signed) {
            $sig = Get-AuthenticodeSignature $signed
            if ($sig.Status -ne 'Valid') { throw "Signature check failed: $($sig.Status) $($sig.StatusMessage)" }
            Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
            Copy-Item $signed $out
            "signed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host 'SignPath is not configured: releasing the unsigned EXE.'
            Copy-Item (Join-Path 'artifacts/publish' $env:EXE_NAME) $out
            "signed=false" >> $env:GITHUB_OUTPUT
          }
          $exe = Join-Path $out $env:EXE_NAME
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:EXE_NAME" | Out-File -Encoding ascii -NoNewline (Join-Path $out "$env:EXE_NAME.sha256")
          Write-Host "SHA-256: $hash"

      - name: Upload release files (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: artifacts/release/*

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = 'K26KControllerMergerV' + $tag.TrimStart('v')
          $files = @("artifacts/release/$env:EXE_NAME", "artifacts/release/$env:EXE_NAME.sha256")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            # New releases start as drafts so the release notes can be written before publishing.
            gh release create $tag @files --draft --title $title --notes "Release notes follow."
          }
